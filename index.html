<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>إكس أو</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><link rel="stylesheet" href="style.css"><style>:root{--c:#2563eb}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.cell{aspect-ratio:1;font-size:15vw;max-height:150px;background:#fff;border-radius:16px;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700}
.cell.O{color:#dc2626}.cell.win{background:#bbf7d0}
@media(min-width:560px){.cell{font-size:80px}}</style></head><body>
<header>إكس أو <span id="status" class="muted" style="color:#fff"></span></header><main>
<div class="card"><div class="row"><div><label>الوضع</label><select id="mode"><option value="cpu">ضد الكمبيوتر</option><option value="two">لاعبين اتنين</option></select></div>
<div><label>المستوى</label><select id="level"><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></div></div></div>
<div id="msg" class="big" style="text-align:center"></div><div id="board"></div>
<div class="card row" style="text-align:center"><div>X<div class="big" id="sx">0</div></div><div>تعادل<div class="big" id="sd">0</div></div><div>O<div class="big" id="so">0</div></div></div>
<div class="row"><button id="again">جولة جديدة</button><button class="alt" id="reset">تصفير النقاط</button></div></main>
<script src="logic.js"></script><script src="app.js"></script></body></html>
